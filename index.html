<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ToolboxLab - 纯前端本地工具集，所有数据仅在本地处理" />
    <meta name="theme-color" content="#edf3fb" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <title>ToolboxLab</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  <!-- Cloudflare Web Analytics -->
    <script type='module'>
      // 动态插入 Cloudflare Analytics 脚本
      const token = __VITE_CLOUDFLARE_ANALYTICS_TOKEN__;
      if (token && token.trim() !== '') {
        try {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          script.setAttribute('data-cf-beacon', JSON.stringify({ token: token }));
          document.body.appendChild(script);
        } catch (error) {
          console.warn('Failed to load Cloudflare Analytics:', error);
        }
      }
    </script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
