<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eff6ff 0%, #e0f2fe 55%, #dbeafe 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #1e293b;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
  .b1 { width: 320px; height: 320px; background: #93c5fd; top: -80px; left: -60px; }
  .b2 { width: 280px; height: 280px; background: #a5b4fc; bottom: -70px; right: -40px; }
  .card {
    position: relative;
    background: rgba(255,255,255,.65);
    border: 1px solid rgba(148,163,184,.35);
    border-radius: 28px;
    padding: 52px 84px;
    text-align: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 50px rgba(59,130,246,.15);
  }
  .logo { font-size: 64px; line-height: 1; }
  .brand { font-size: 64px; font-weight: 800; letter-spacing: 1px; margin-top: 14px; color: #0f172a; }
  .tagline { font-size: 26px; color: #475569; margin-top: 16px; }
  .pills { display: flex; gap: 14px; justify-content: center; margin-top: 30px; }
  .pill {
    font-size: 18px; color: #334155;
    background: rgba(255,255,255,.8);
    border: 1px solid rgba(148,163,184,.4);
    padding: 8px 20px; border-radius: 999px;
  }
  .foot { position: absolute; bottom: 34px; font-size: 17px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="card">
    <div class="logo">🧰</div>
    <div class="brand">ToolboxLab</div>
    <div class="tagline">139 个免费在线工具 · 数据仅在浏览器本地处理 · 中英双语</div>
    <div class="pills">
      <span class="pill">JSON / 正则</span>
      <span class="pill">图片处理</span>
      <span class="pill">PDF 工具箱</span>
      <span class="pill">开发者工具</span>
    </div>
  </div>
  <div class="foot">toolboxlab.pages.dev</div>
</body>
</html>
